<!DOCTYPE HTML>
<html lang="en">

<head>
	<title>Chorus32 &middot; Live</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#0b0b0c" />
	<link rel="icon" href="logo.jpg" />
	<link rel="stylesheet" href="assets/css/bc.css" />
</head>

<body>
	<header class="bc-header"></header>
	<nav class="bc-nav"></nav>

	<div class="bc-card" id="mismatch_card" style="display:none">
		<h2>Version mismatch</h2>
		<p class="bc-small" id="mismatch_text"></p>
		<a class="bc-btn" href="update.html" style="display:inline-flex;align-items:center">Go to update</a>
	</div>

	<section class="bc-card">
		<h2>Receiver RSSI</h2>
		<div class="bc-plot-wrap">
			<canvas class="bc-plot" id="rssi_plot"></canvas>
		</div>
		<div class="bc-legend" id="rssi_legend"></div>
		<div class="bc-empty" id="rssi_empty" style="display:none">
			No receivers are enabled, so there is nothing to plot.<br />
			<a href="settings.html">Enable a receiver in Settings</a>
		</div>
		<div class="bc-row" style="margin-top:12px">
			<div class="bc-field" style="margin:0">
				<label for="plot_interval">Sample interval</label>
				<select id="plot_interval">
					<option value="0">Off</option>
					<option value="20">20 ms</option>
					<option value="50" selected>50 ms</option>
					<option value="100">100 ms</option>
					<option value="250">250 ms</option>
				</select>
			</div>
			<div class="bc-field" style="margin:0">
				<label for="plot_window">Window</label>
				<select id="plot_window">
					<option value="10000">10 s</option>
					<option value="20000" selected>20 s</option>
					<option value="60000">60 s</option>
				</select>
			</div>
		</div>
	</section>

	<section class="bc-card">
		<h2>Status</h2>
		<div class="bc-stats">
			<div class="bc-stat">
				<div class="bc-stat-label">Race</div>
				<div class="bc-stat-value" id="stat_race">&mdash;</div>
			</div>
			<div class="bc-stat">
				<div class="bc-stat-label">Battery</div>
				<div class="bc-stat-value"><span id="stat_vbat">&mdash;</span><span class="bc-small bc-dim">V</span></div>
			</div>
			<div class="bc-stat">
				<div class="bc-stat-label">Receivers</div>
				<div class="bc-stat-value" id="stat_rx">&mdash;</div>
			</div>
			<div class="bc-stat">
				<div class="bc-stat-label">Free heap</div>
				<div class="bc-stat-value"><span id="stat_heap">&mdash;</span><span class="bc-small bc-dim">kB</span></div>
			</div>
		</div>
	</section>

	<footer class="bc-footer">
		<span id="foot_version">&mdash;</span>
		<span id="foot_build" class="bc-dim"></span>
	</footer>

	<script src="bc.js"></script>
	<script src="plot.js"></script>
	<script src="index.js"></script>
</body>

</html>
