<!DOCTYPE HTML>
<html lang="en">

<head>
	<title>Chorus32 &middot; Race</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#0b0b0c" />
	<link rel="icon" href="logo.jpg" />
	<link rel="stylesheet" href="assets/css/bc.css" />
	<link rel="stylesheet" href="assets/css/race.css" />
</head>

<body>
	<header class="bc-header"></header>
	<nav class="bc-nav"></nav>

	<section class="bc-card bc-race-bar">
		<div class="bc-race-state">
			<div class="bc-stat-label">Round <span id="race_num">&mdash;</span></div>
			<div class="bc-race-status" id="race_status">Idle</div>
			<div class="bc-stat-label bc-mono" id="race_clock">00:00</div>
		</div>
		<button id="race_button" class="bc-primary">Start</button>
	</section>

	<div id="standings"></div>

	<div class="bc-empty" id="standings_empty">
		No receivers are enabled.<br />
		<a href="settings.html">Enable them in Settings</a>
	</div>

	<section class="bc-card">
		<h2>Race options</h2>
		<div class="bc-row">
			<div class="bc-field" style="margin:0">
				<label for="target_laps">Laps</label>
				<input id="target_laps" type="number" min="1" max="99" value="5" />
			</div>
			<div class="bc-field" style="margin:0">
				<label for="voice_select">Voice</label>
				<select id="voice_select"></select>
			</div>
		</div>
		<div class="bc-row" style="margin-top:12px">
			<label class="bc-check"><input type="checkbox" id="opt_voice" checked /> Callouts</label>
			<label class="bc-check"><input type="checkbox" id="opt_awake" checked /> Keep screen awake</label>
		</div>
		<div class="bc-small bc-dim" id="awake_state" style="margin-top:8px"></div>
	</section>

	<footer class="bc-footer">
		<span id="foot_version">&mdash;</span>
		<span class="bc-dim">Lap times are reported by the timer</span>
	</footer>

	<script src="bc.js"></script>
	<script src="nosleep.js"></script>
	<script src="announcer.js"></script>
	<script src="race.js"></script>
</body>

</html>
