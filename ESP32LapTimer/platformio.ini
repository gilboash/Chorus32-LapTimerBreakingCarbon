; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32 @ ~3.5.0
board = pico32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    https://github.com/ThingPulse/esp8266-oled-ssd1306
    https://github.com/adafruit/Adafruit_BusIO
    https://github.com/adafruit/Adafruit_INA219.git
    https://github.com/me-no-dev/ESPAsyncTCP
    https://github.com/me-no-dev/ESPAsyncWebServer
    https://github.com/sandeepmistry/arduino-LoRa
    ; Pinned deliberately. AsyncTCP arrives as a transitive dependency of
    ; ESPAsyncWebServer, and everything above is an unpinned git URL, so the
    ; version resolved depends on when the environment happened to be
    ; installed. 3.5.0 uses CONFIG_ESP_TASK_WDT_TIMEOUT_S, which the ESP-IDF
    ; behind platform espressif32 @ ~3.5.0 does not define, so it does not
    ; compile here; 3.4.0 is what this project has actually been building
    ; against. Without the pin, two environments installed on different days
    ; get different libraries and one of them fails.
    esp32async/AsyncTCP@3.4.0
board_build.partitions = timer_partitions.csv
;board_build.partitions = huge_app.csv
lib_compat_mode=strict
; version_build.py must run first: it generates data_src/version.json, which
; prepare_data.py then copies into the filesystem image.
extra_scripts =
    patch_libs.py
    version_build.py
    prepare_data.py

[env:BOARD_MICRO32]
build_flags =
    -D BOARD=BOARD_MICRO32

; Same board, but with the ESP-IDF log statements actually compiled in.
; CORE_DEBUG_LEVEL defaults to 0, which turns every log_i/log_d/log_e in the
; tree into nothing -- so the stock build is almost silent on serial and there
; is nothing for the ER*L log-streaming command to forward either.
;
; With this build, logs reach you two ways:
;   - over serial at 115200, which needs the cable and a reset to see boot
;   - over wifi: send "ER*L1" on the websocket and esp_log output is relayed
;     to every connected client as ER*L messages. No cable.
;
; Not the default because at level 4 the logging itself costs time, and this
; firmware is timing laps.
[env:BOARD_MICRO32_DEBUG]
build_flags =
    -D BOARD=BOARD_MICRO32
    -D CORE_DEBUG_LEVEL=4
    -D USE_SERIAL_OUTPUT

[env:BOARD_DEFAULT]
build_flags =
    -D BOARD=BOARD_DEFAULT

[env:BOARD_TTGO_LORA]
build_flags =
    -D BOARD=BOARD_TTGO_LORA

[env:BOARD_OLD]
build_flags =
    -D BOARD=BOARD_OLD

[env:BOARD_WROOM]
build_flags =
    -D BOARD=BOARD_WROOM
